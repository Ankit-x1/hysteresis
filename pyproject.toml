[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hysteresis"
version = "0.1.1"
description = "Replay, score, and quality-gate supported alert rules against labeled metric history."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
live = ["prometheus-client>=0.20"]

[project.scripts]
hysteresis = "hysteresis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires Docker and the pinned Prometheus image"]

[tool.ruff]
line-length = 100
